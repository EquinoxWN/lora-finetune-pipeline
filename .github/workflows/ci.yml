name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow can read the code and nothing else.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Unit and end-to-end tests on a tiny random model, CPU only: no GPU and no model download.
    # The QLoRA comparison itself (make run) needs an NVIDIA GPU and is run locally.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # Every action is pinned to a full commit SHA; Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make setup
      - run: make lint
      - name: Tests
        run: |
          set -o pipefail
          make test 2>&1 | tee .tmp/pytest.log
          echo "::notice title=tests::$(tail -n 1 .tmp/pytest.log)"
      - name: Known-vulnerability audit
        run: make audit
